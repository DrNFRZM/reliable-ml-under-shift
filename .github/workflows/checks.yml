name: Research code checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: shift-study smoke --config configs/smoke.json --output runs/ci-smoke
      - run: python -m shiftstudy.cli evaluate --run results/reference
      - run: python scripts/tree_diagnostic.py evaluate --run results/reference/tree-diagnostic
      - name: Check numerical result files remain reproducible
        run: >-
          git diff --exit-code -- results/reference/metrics.csv
          results/reference/summary.csv results/reference/paired_deltas.csv
          results/reference/paired_summary.csv results/reference/per_class.csv
          results/reference/calibration_bins.csv results/reference/risk_coverage.csv
          results/reference/conformal_thresholds.csv results/reference/tree-diagnostic/metrics.csv
