name: Canonical Weather reference
# Manual only. The evidence in results/reference came from run 37442161270 of
# this workflow at commit a6228dd, when it was also triggered by a commit-message
# tag and wrote to results/reference. A new run writes to the ignored runs/
# directory and uploads an artifact; it never touches the committed evidence.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canonical-weather-reference
  cancel-in-progress: false
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recorded environment
        run: python -m pip install -r requirements-lock.txt -e .
      - name: Unit and integration checks
        run: python -m unittest discover -s tests -v
      - name: Download official canonical archive
        run: |
          mkdir -p data
          df -h .
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 1200 \
            --speed-limit 100000 --speed-time 60 \
            https://storage.yandexcloud.net/yandex-research/shifts/weather/canonical-partitioned-dataset.tar \
            --output data/canonical-partitioned-dataset.tar
      - name: Prepare complete-CSV deterministic samples
        run: >-
          python -m shiftstudy.cli prepare
          --source data/canonical-partitioned-dataset.tar
          --config configs/weather.json --output data/weather-prepared
      - name: Run unchanged primary configuration
        run: >-
          python -m shiftstudy.cli run --data data/weather-prepared
          --config configs/weather.json --output runs/canonical
      - name: Post-hoc tree diagnostic (exploratory)
        run: >-
          python scripts/tree_diagnostic.py run --data data/weather-prepared
          --reference runs/canonical --output runs/canonical/tree-diagnostic
      - name: Upload the run, including partial output on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-rerun-${{ github.sha }}
          path: runs/canonical/
          if-no-files-found: warn
          retention-days: 14
